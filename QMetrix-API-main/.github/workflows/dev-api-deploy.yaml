  build-and-deploy-api:
    runs-on: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Dependencies
        run: npm install

      - name: Set UI Base URL for Dev in .env file
        run: |
              echo "ALLOWED_ORIGIN=${{ secrets.ALLOWED_ORIGIN_DEV }}" >> $GITHUB_ENV
              echo "ALLOWED_ORIGIN_SWAGGER=${{ secrets.ALLOWED_ORIGIN_SWAGGER_DEV }}" >> $GITHUB_ENV
              echo "NODE_ENV=${{ secrets.NODE_ENV_DEV}}" >> $GITHUB_ENV
              echo "PORT=${{ secrets.PORT}}" >> $GITHUB_ENV
              # echo "TENANT_DB=${{ secrets.TENANT_DB}}" >> $GITHUB_ENV
              echo "JWT_SECRET=${{ secrets.JWT_SECRET}}" >> $GITHUB_ENV
              echo "JWT_EXPIRE=${{ secrets.JWT_EXPIRE}}" >> $GITHUB_ENV
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID}}" >> $GITHUB_ENV
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET}}" >> $GITHUB_ENV
              echo "SESSION_SECRET=${{ secrets.SESSION_SECRET}}" >> $GITHUB_ENV
              echo "SONAR_TOKEN_DEV=${{ secrets.SONAR_TOKEN_DEV}}" >> $GITHUB_ENV
              echo "SONAR_HOST_URL_DEV=${{ secrets.SONAR_HOST_URL_DEV}}" >> $GITHUB_ENV
              echo "SONAR_SCANNER_PATH=${{ secrets.SONAR_SCANNER_PATH}}" >> $GITHUB_ENV
              echo "ENCRYPT_DECRYPT_SECRET_KEY=${{ secrets.ENCRYPT_DECRYPT_SECRET_KEY}}" >> $GITHUB_ENV
              echo "RESET_PASSWORD_SECRET_KEY=${{ secrets.RESET_PASSWORD_SECRET_KEY}}" >> $GITHUB_ENV
              echo "NODE_SENDER_MAIL_ID=${{ secrets.NODE_SENDER_MAIL_ID}}" >> $GITHUB_ENV
              echo "NODE_SENDER_MAIL_ID_HOST=${{ secrets.NODE_SENDER_MAIL_ID_HOST}}" >> $GITHUB_ENV
              echo "NODE_SENDER_MAIL_PASS=${{ secrets.NODE_SENDER_MAIL_PASS}}" >> $GITHUB_ENV
              echo "NODE_SENDER_MAIL_USER=${{ secrets.NODE_SENDER_MAIL_USER}}" >> $GITHUB_ENV
              echo "TENANT_DB=${{ secrets.TENANT_DB_DEV}}" >> $GITHUB_ENV
              echo "TENANT_DB_DEV_CA_FILE=${{ secrets.TENANT_DB_DEV_CA_FILE}}" >> $GITHUB_ENV
                          
        
      - name: Run ESLint
        run: npm run lint
        
      - name: Stop the previous application instance
        run: |
          export PM2_HOME=/opt/.pm2
          pm2 stop QM-api || echo "No process found to stop"

      - name: delete the previous application process
        run: |
          export PM2_HOME=/opt/.pm2
          pm2 delete QM-api || echo "No process found to delete"

      - name: start the application
        run: |
          export PM2_HOME=/opt/.pm2
          pm2 start npm --name QM-api  -- start --log-date-format "YYYY-MM-DD HH:mm:ss"

      - name: Save PM2 Process List
        run: |
            pm2 save

  jira-transition-and-comment:
    needs: build-and-deploy-api
    runs-on: dev
    if: success()

    steps:
      - name: Extract Jira ID from branch/PR title
        id: extract_id
        uses: geokats7/extract-jira-id-action@v1.0.0

      - name: Jira Login
        if: ${{ steps.extract_id.outputs.jira_ticket_id != '' }}
        uses: frieder/gha-jira-login@v1
        env:
          JIRA_BASE_URL:  ${{ secrets.ATLASSIAN_CLOUD_DOMAIN }}
          JIRA_USER_EMAIL: ${{ secrets.ATLASSIAN_CLOUD_USER }}
          JIRA_API_TOKEN:  ${{ secrets.ATLASSIAN_CLOUD_APIKEY }}

      - name: Get Jira issue info
        if: ${{ steps.extract_id.outputs.jira_ticket_id != '' }}
        uses: frieder/jira-issue-info@v1
        id: issue
        with:
          issue: ${{ steps.extract_id.outputs.jira_ticket_id }}

      - name: Transition issue to QA IN-PROGRESS
        id: transition
        if: |
          steps.extract_id.outputs.jira_ticket_id != '' &&
          steps.issue.outputs.status == 'QA READY'
        uses: frieder/jira-issue-transition@v1
        with:
          issue: ${{ steps.extract_id.outputs.jira_ticket_id }}
          transition: QA - Inprogress

      - name: Comment build result in Jira
        if: steps.transition.outcome == 'success'
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.extract_id.outputs.jira_ticket_id }}
          comment: |
             BUILD ${{ needs.build-and-deploy-api.result }} #${{ github.run_number }}
             [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Send QA Status Notification via Email
        if: |
          steps.extract_id.outputs.jira_ticket_id != '' &&
          steps.issue.outputs.status == 'QA READY' &&
          steps.transition.outcome == 'success'
        uses: JaSiLez/smtp-notifier@v1.1.2
        with:
          server_address: ${{ secrets.SES_SERVER_ADDRESS }}
          server_port: 587
          secure: false
          username: ${{ secrets.SES_USERNAME }}
          password: ${{ secrets.SES_SENDER_PASSWORD }}
          subject: "Jira Ticket ${{ steps.extract_id.outputs.jira_ticket_id }} Ready for QA Testing"
          to: qmetrix-auto-servers@trigent.com
          from: "Auto Notification <qmetrix-auto-servers@trigent.com>"
          body: |
            Hello user,
      
            The Jira ticket ${{ steps.extract_id.outputs.jira_ticket_id }} has been moved to **QA In Progress** and is now ready for testing.
            
            Please begin testing at your earliest convenience.
           
            **Details:**
            - Branch: ${{ github.ref_name }}
            - Run Link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Best regards,
            Auto Notifier
          
